[package]
name = "splinewright-eps"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Splinewright Encapsulated PostScript: a hand-written EPS writer (PostScript Level 2 and 3) with TIFF previews"

[lints]
workspace = true

[dependencies]
splinewright-geom = { workspace = true }
splinewright-color = { workspace = true }
splinewright-doc = { workspace = true }
splinewright-effects = { workspace = true }
splinewright-brush = { workspace = true }
splinewright-text = { workspace = true }
# Windows metafile previews, opened when a file's PostScript can't be read.
splinewright-metafile = { workspace = true }
# The TIFF writer (previews) and PackBits, shared with raster export.
splinewright-render = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
splinewright-testkit = { workspace = true }
