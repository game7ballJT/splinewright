[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/splinewright", "apps/splinewright-cli", "xtask"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/game7ballJT/splinewright"

[workspace.dependencies]
# internal
splinewright-geom = { path = "crates/geom" }
splinewright-color = { path = "crates/color" }
splinewright-doc = { path = "crates/doc" }
splinewright-pathops = { path = "crates/pathops" }
splinewright-brush = { path = "crates/brush" }
splinewright-trace = { path = "crates/trace" }
splinewright-text = { path = "crates/text" }
splinewright-effects = { path = "crates/effects" }
splinewright-render = { path = "crates/render" }
splinewright-svg = { path = "crates/svg" }
splinewright-pdf = { path = "crates/pdf" }
splinewright-format = { path = "crates/format" }
splinewright-tools = { path = "crates/tools" }
splinewright-engine = { path = "crates/engine" }
splinewright-ui-egui = { path = "crates/ui-egui" }
splinewright-mcp = { path = "crates/mcp" }
splinewright-testkit = { path = "crates/testkit" }
splinewright-cad = { path = "crates/cad" }
splinewright-eps = { path = "crates/eps" }
splinewright-metafile = { path = "crates/metafile" }
splinewright-plugins = { path = "crates/plugins" }

# foundation
kurbo = { version = "0.13", features = ["serde"] }
peniko = "0.6"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = "0.4"
proptest = "1"
# tests: a TCP port bound without listening (connections to it are refused)
socket2 = "0.6"
# Sandboxed WebAssembly plug-ins: a pure-Rust interpreter (MIT OR Apache-2.0) that builds for wasm32
# too. Without `wat` (text parsing is test-only) and memory64; `validate` keeps full module
# validation on; the portable dispatcher can't overflow the host stack on long-running modules.
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
# Tests: WebAssembly text -> binary for the plug-in fixtures (Apache-2.0 WITH LLVM-exception).
wat = "1.228"

# rendering / formats
vello_cpu = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
usvg = "0.48"
krilla = "0.8"
skrifa = "0.47"
harfrust = "0.13"
linesweeper = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
jpeg-encoder = { version = "0.6", default-features = false, features = ["std"] }
gif = { version = "0.14", default-features = false, features = ["std", "raii_no_panic"] }
# CMYK image samples (splinewright-doc's cmyk module): the image crate's own TIFF and JPEG
# decoders, read directly (the image crate converts CMYK to RGB).
tiff = "0.11"
zune-jpeg = "0.5"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
arboard = { version = "3.6", default-features = false }
clipboard-win = "5.4"
webbrowser = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
# Splinewright never crashes: shipped code returns `Result`/`Option` instead of panicking (see
# AGENTS.md › Robustness). Tests may unwrap (clippy.toml).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# The browser build (`trunk build --release` in apps/splinewright-web picks this profile through
# `data-cargo-profile`): small code everywhere (opt-level "s", fat LTO), full speed in the crates
# that draw and cut paths. The plain release profile gave a 43 MiB .wasm, over the 24 MiB gate.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[profile.wasm-release.package."*"]
opt-level = "s"

[profile.wasm-release.package.splinewright-geom]
opt-level = 3
[profile.wasm-release.package.splinewright-render]
opt-level = 3
[profile.wasm-release.package.splinewright-pathops]
opt-level = 3
[profile.wasm-release.package.vello_cpu]
opt-level = 3
[profile.wasm-release.package.kurbo]
opt-level = 3
[profile.wasm-release.package.linesweeper]
opt-level = 3
